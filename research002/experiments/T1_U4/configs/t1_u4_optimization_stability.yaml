experiment:
  id: T1-U4
  name: Weight-Tied Transformer Optimization-Basin Stabilization Study
  version: 0.8.0
  research_object: >-
    Determine whether residual-update scaling, an area-matched auxiliary-loss
    taper, or their combination improves robust learning across the exposed
    T1-U3 development seeds while the task, model size, data, and total update
    budget remain fixed.

hypotheses:
  optimization: >-
    At least one intervention improves the minimum seed-level tail validation
    accuracy over the closed T1-U3 reference by at least 0.03 and satisfies
    the preregistered screening thresholds.
  independent: >-
    The validation-selected intervention reaches at least 0.95 independent
    accuracy and retains at least two nonsaturated future-flip layers for every
    development seed.
  null: >-
    No intervention clears the screening gate, or the selected intervention
    fails the independent multi-seed gate.

scientific_boundary:
  development_seeds_are_exposed: true
  note: >-
    Seeds 503, 607, and 709 were observed in T1-U3 and are used only for bounded
    optimization development. A passing T1-U4 candidate still requires a
    separately preregistered fresh-seed confirmation before trajectory probing.

seeds: [503, 607, 709]

data:
  task_type: chain_lookup
  key_count: 8
  pair_count: 4
  chain_hops: 1
  train_samples: 8000
  validation_samples: 1800
  probe_samples: 4000

base_model:
  d_model: 32
  n_heads: 2
  d_ff: 64
  n_layers: 6
  n_classes: 2
  layer_norm_epsilon: 0.00001
  use_structure_embeddings: true
  tie_layers: true
  use_step_embeddings: false

base_training:
  batch_size: 96
  validation_batch_size: 600
  learning_rate: 0.0005
  max_grad_norm: 1.0
  auxiliary_loss_weight: 0.0
  log_every: 200

schedules:
  abrupt:
    - name: low_auxiliary_learning
      steps: 2000
      data_stream_id: 0
      data_overrides: {chain_hops: 1}
      auxiliary_loss_weight: 0.02
      learning_rate: 0.0012
    - name: final_only
      steps: 2000
      data_stream_id: 1
      data_overrides: {chain_hops: 1}
      auxiliary_loss_weight: 0.0
      learning_rate: 0.0005
  area_matched_taper:
    - name: full_auxiliary
      steps: 1700
      data_stream_id: 0
      data_overrides: {chain_hops: 1}
      auxiliary_loss_weight: 0.02
      learning_rate: 0.0012
    - name: taper_015
      steps: 200
      data_stream_id: 0
      data_overrides: {chain_hops: 1}
      auxiliary_loss_weight: 0.015
      learning_rate: 0.0012
    - name: taper_010_pre_transition
      steps: 100
      data_stream_id: 0
      data_overrides: {chain_hops: 1}
      auxiliary_loss_weight: 0.01
      learning_rate: 0.0012
    - name: taper_010_post_transition
      steps: 100
      data_stream_id: 1
      data_overrides: {chain_hops: 1}
      auxiliary_loss_weight: 0.01
      learning_rate: 0.0005
    - name: taper_005
      steps: 200
      data_stream_id: 1
      data_overrides: {chain_hops: 1}
      auxiliary_loss_weight: 0.005
      learning_rate: 0.0005
    - name: final_only
      steps: 1700
      data_stream_id: 1
      data_overrides: {chain_hops: 1}
      auxiliary_loss_weight: 0.0
      learning_rate: 0.0005

factor_matrix:
  - id: U4-A-reference
    train: false
    residual_scale: 1.0
    transition: abrupt
    source_history: outputs/t1_u3/training_history.csv
    rationale: Closed T1-U3 reference; loaded without reusing independent outcomes.
  - id: U4-B-residual-half
    train: true
    residual_scale: 0.5
    transition: abrupt
    rationale: Bound each attention and feed-forward update in the tied recurrence.
  - id: U4-C-aux-taper
    train: true
    residual_scale: 1.0
    transition: area_matched_taper
    rationale: Replace the abrupt auxiliary-loss removal with equal integrated supervision.
  - id: U4-D-combined
    train: true
    residual_scale: 0.5
    transition: area_matched_taper
    rationale: Test whether bounded recurrent updates and smooth supervision interact.

screening:
  tail_validation_points: 4
  primary_metric: minimum_seed_tail_mean_validation_accuracy
  minimum_seed_tail_mean_validation_accuracy: 0.90
  minimum_mean_tail_validation_accuracy: 0.93
  minimum_primary_gain_over_reference: 0.03
  ranking_tiebreakers:
    - mean_seed_tail_validation_accuracy
    - minimum_terminal_validation_accuracy
    - mean_terminal_validation_accuracy
    - candidate_id_ascending

independent_validity:
  minimum_final_accuracy: 0.95
  minimum_future_flip_rate: 0.05
  maximum_future_flip_rate: 0.45
  minimum_valid_layers_per_seed: 2
  minimum_passing_seed_fraction: 1.0

sealed_evaluation:
  rule: >-
    All trainable candidates and seeds complete without adaptive stopping.
    Candidate selection uses validation metrics only. Independent data are
    opened only for the selected candidate if it clears every screening gate.

probes:
  policy: >-
    No state-history, motion, or attention-history probe is fitted in T1-U4.
    Even a passing result advances only to fresh-seed learning confirmation.
