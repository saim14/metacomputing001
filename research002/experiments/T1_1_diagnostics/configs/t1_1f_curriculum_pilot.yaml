experiment:
  id: T1.1f-pilot
  name: Curriculum-trained Multi-hop Trajectory and Attention Pilot
  version: 0.3.0
  research_object: Six-layer Transformer trained from balanced one-hop retrieval through three-hop pointer composition

hypotheses:
  primary: >-
    In a successfully learned multi-hop computation, ordered layer-state history
    improves future-flip prediction beyond current, dimension-matched, shuffled,
    and sample-mismatched controls.
  attention: >-
    Ordered per-head attention-summary history improves prediction beyond the
    current state plus current attention and matched attention-history controls.
  secondary: >-
    Ordered state and attention histories improve prediction of future reduction
    in negative log-likelihood under their respective controls.
  null: >-
    Neither historical family adds stable predictive information after current
    state and current attention are available.

seeds: [101]

data:
  task_type: chain_lookup
  key_count: 8
  pair_count: 6
  chain_hops: 3
  train_samples: 8000
  validation_samples: 1600
  probe_samples: 3200

model:
  d_model: 32
  n_heads: 2
  d_ff: 64
  n_layers: 6
  n_classes: 2
  layer_norm_epsilon: 0.00001
  use_structure_embeddings: true

training:
  batch_size: 96
  validation_batch_size: 320
  learning_rate: 0.0012
  max_grad_norm: 1.0
  auxiliary_loss_weight: 0.05
  log_every: 100
  curriculum:
    - name: balanced_one_hop
      steps: 2000
      data_overrides: {chain_hops: 1}
      auxiliary_loss_weight: 0.25
      learning_rate: 0.0015
    - name: balanced_two_hop
      steps: 1200
      data_overrides: {chain_hops: 2}
      auxiliary_loss_weight: 0.15
      learning_rate: 0.0012
    - name: balanced_three_hop
      steps: 1600
      data_overrides: {chain_hops: 3}
      auxiliary_loss_weight: 0.05
      learning_rate: 0.0010

probes:
  test_fraction: 0.40
  minimum_class_count: 24
  ridge_alpha: 1.0

validity:
  minimum_final_accuracy: 0.85
  minimum_future_flip_rate: 0.05
  maximum_future_flip_rate: 0.45
  minimum_valid_layers_per_seed: 3
  minimum_passing_seed_fraction: 1.0
