experiment:
  id: T1-U3
  name: Weight-Tied Transformer Training-Stability Study
  version: 0.7.0
  research_object: >-
    Test whether extending final-only training makes the compact T1-U2
    configuration reliably learn shortcut-free balanced retrieval across fresh seeds.

hypotheses:
  learning: >-
    The fixed compact weight-tied Transformer reaches independent accuracy of
    at least 0.95 across all fresh seeds under the extended training schedule.
  target: >-
    Every learned model retains nondegenerate future decision changes at two
    or more intermediate refinement steps.
  null: >-
    At least one seed fails the independent learning or target-validity gate.

historical_reference:
  experiment: T1-U2
  selected_candidate: U2-A-low-aux
  seed_311_independent_accuracy: 0.97250
  seed_421_independent_accuracy: 0.81675
  note: >-
    Historical context only. T1-U2 remains closed; T1-U3 uses fresh seeds and
    does not reinterpret or extend its statistical claims.

seeds: [503, 607, 709]

data:
  task_type: chain_lookup
  key_count: 8
  pair_count: 4
  chain_hops: 1
  train_samples: 8000
  validation_samples: 1800
  probe_samples: 4000

model:
  d_model: 32
  n_heads: 2
  d_ff: 64
  n_layers: 6
  n_classes: 2
  layer_norm_epsilon: 0.00001
  use_structure_embeddings: true
  tie_layers: true
  use_step_embeddings: false

training:
  batch_size: 96
  validation_batch_size: 600
  learning_rate: 0.0005
  max_grad_norm: 1.0
  auxiliary_loss_weight: 0.0
  log_every: 200
  comparison_horizon_step: 2400
  curriculum:
    - name: low_auxiliary_learning
      steps: 2000
      data_overrides: {chain_hops: 1}
      auxiliary_loss_weight: 0.02
      learning_rate: 0.0012
    - name: extended_final_only
      steps: 2000
      data_overrides: {chain_hops: 1}
      auxiliary_loss_weight: 0.0
      learning_rate: 0.0005

independent_validity:
  minimum_final_accuracy: 0.95
  minimum_future_flip_rate: 0.05
  maximum_future_flip_rate: 0.45
  minimum_valid_layers_per_seed: 2
  minimum_passing_seed_fraction: 1.0

sealed_evaluation:
  rule: >-
    Training schedules complete without adaptive stopping. Independent data
    are evaluated only after each fixed run finishes and never influence later runs.

probes:
  policy: >-
    No state-history or attention-history probes are run in T1-U3. Passing
    freezes this configuration for a separately preregistered confirmatory experiment.
