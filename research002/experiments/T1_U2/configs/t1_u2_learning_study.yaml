experiment:
  id: T1-U2
  name: Bounded Weight-Tied Transformer Learning Study
  version: 0.6.0
  research_object: >-
    Identify a learnable recurrent Transformer configuration without using
    trajectory-probe performance for model selection.

hypotheses:
  learning: >-
    Lower intermediate supervision, additional shared-block capacity, or an
    explicit recurrent time signal can overcome the T1-U accuracy plateau on
    shortcut-free balanced retrieval.
  null: >-
    None of the bounded candidates reaches the preregistered validation
    advancement threshold or independent learning-validity threshold.

historical_reference:
  experiment: T1-U-pilot
  independent_accuracy: 0.75525
  best_validation_accuracy: 0.77250
  note: Historical reference only; T1-U remains closed and is not rerun or retuned.

selection:
  seed: 311
  replication_seed: 421
  tail_checkpoints: 3
  minimum_validation_score: 0.85
  ranking:
    - descending_tail_mean_validation_accuracy
    - descending_terminal_validation_accuracy
    - ascending_unique_parameter_count
    - ascending_candidate_id
  sealed_data_rule: >-
    Independent probe data and trajectory-validity statistics are evaluated
    only for the selected candidate after it clears the validation advancement gate.

data:
  task_type: chain_lookup
  key_count: 8
  pair_count: 4
  chain_hops: 1
  train_samples: 8000
  validation_samples: 1800
  probe_samples: 4000

base_model:
  n_layers: 6
  n_classes: 2
  layer_norm_epsilon: 0.00001
  use_structure_embeddings: true
  tie_layers: true

base_training:
  batch_size: 96
  validation_batch_size: 600
  learning_rate: 0.0005
  max_grad_norm: 1.0
  auxiliary_loss_weight: 0.0
  log_every: 200
  curriculum:
    - name: learning
      steps: 2000
      data_overrides: {chain_hops: 1}
      auxiliary_loss_weight: 0.02
      learning_rate: 0.0012
    - name: final_only_finetune
      steps: 400
      data_overrides: {chain_hops: 1}
      auxiliary_loss_weight: 0.0
      learning_rate: 0.0005

candidates:
  - id: U2-A-low-aux
    rationale: Isolate reduced intermediate-loss pressure at T1-U capacity.
    model:
      d_model: 32
      n_heads: 2
      d_ff: 64
      use_step_embeddings: false

  - id: U2-B-wide
    rationale: Add shared-block capacity without adding a recurrent time signal.
    model:
      d_model: 48
      n_heads: 3
      d_ff: 96
      use_step_embeddings: false

  - id: U2-C-wide-time
    rationale: Add shared-block capacity and learned refinement-step embeddings.
    model:
      d_model: 48
      n_heads: 3
      d_ff: 96
      use_step_embeddings: true

independent_validity:
  minimum_final_accuracy: 0.95
  minimum_future_flip_rate: 0.05
  maximum_future_flip_rate: 0.45
  minimum_valid_layers_per_seed: 2
  require_selection_and_replication_seed: true

probes:
  policy: >-
    No state-history or attention-history probes are run in T1-U2. If the
    selected model passes learning and target validity, its configuration is
    frozen for a separately preregistered confirmatory experiment.
