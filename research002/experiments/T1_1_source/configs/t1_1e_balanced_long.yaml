experiment:
  id: T1.1e-diagnostic
  name: Long Balanced Retrieval Diagnostic
  version: 0.2.5
  research_object: T1 architecture with extended training on balanced one-hop retrieval

hypotheses:
  primary: Extended optimization allows T1's architecture to learn balanced retrieval.
  attention: Diagnostic only.
  secondary: Diagnostic only.
  null: Additional steps do not resolve the balanced retrieval bottleneck.

seeds: [101]

data:
  task_type: chain_lookup
  key_count: 8
  pair_count: 4
  chain_hops: 1
  train_samples: 6000
  validation_samples: 1200
  probe_samples: 1600

model:
  d_model: 32
  n_heads: 2
  d_ff: 64
  n_layers: 4
  n_classes: 2
  layer_norm_epsilon: 0.00001
  use_structure_embeddings: true

training:
  steps: 1800
  batch_size: 96
  validation_batch_size: 300
  learning_rate: 0.0015
  max_grad_norm: 1.0
  auxiliary_loss_weight: 0.25
  log_every: 100

probes:
  test_fraction: 0.40
  minimum_class_count: 24
  ridge_alpha: 1.0

validity:
  minimum_final_accuracy: 0.85
  minimum_future_flip_rate: 0.0
  maximum_future_flip_rate: 1.0
  minimum_valid_layers_per_seed: 0
  minimum_passing_seed_fraction: 1.0
